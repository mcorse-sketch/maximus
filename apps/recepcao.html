<style>
/* blocos do totem que nunca tiveram regra */
.klab{font-size:15.5px;color:#2b3644;margin:18px 0 7px;font-weight:600}
.kfld-num{text-align:left;font-size:20px;letter-spacing:normal;padding:16px 18px}
.krol{position:relative;height:280px;max-width:340px;margin:6px auto 2px}
.krol .band{position:absolute;left:0;right:0;top:112px;height:56px;border-radius:14px;border:3px solid #0e5e6f;pointer-events:none}
.krol .lista{height:280px;overflow-y:auto;scroll-snap-type:y mandatory;padding:112px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.krol .lista::-webkit-scrollbar{display:none}
.krol .it{height:56px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:30px;color:#8d9ba0;font-variant-numeric:tabular-nums}
.krol .it.on{color:#141413;font-weight:700;font-size:36px}
.krol .un{position:absolute;right:14px;top:128px;font-size:18px;color:#6b6a66}
.kcontato .klab{margin-top:14px}
.kcontato .kaviso{font-size:15px;color:#8a5a0b;margin-top:10px;line-height:1.5}
.kfld-falta{border-color:#8a5a0b!important}

.kjornada{counter-reset:j;list-style:none;margin:20px 0 0;padding:0}
.kjornada li{counter-increment:j;position:relative;padding:14px 0 14px 46px;font-size:16.5px;
  line-height:1.5;color:#2b3644;border-top:1px solid #dfdcd3}
.kjornada li::before{content:counter(j);position:absolute;left:0;top:13px;width:30px;height:30px;
  border-radius:50%;background:#0b1f3b;color:#fff;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.kobs{margin-top:22px;padding:14px 16px;border-left:4px solid #8a6d12;background:#f2efe6;
  font-size:16px;color:#2b3644;line-height:1.5;border-radius:0 10px 10px 0}
.kobs2{font-size:15.5px;color:#3a4453;margin-top:14px;text-align:center;line-height:1.5}
.kentrega{margin:22px 0 6px;padding:22px;border-radius:16px;background:#0b1f3b;color:#fff;
  font-size:21px;font-weight:600;text-align:center;line-height:1.35}
.ktermo{max-height:52vh;overflow-y:auto;padding:16px 18px;border:2px solid #b9c0cb;
  border-radius:14px;background:#fff;-webkit-overflow-scrolling:touch}
.ktermo p{font-size:15px;line-height:1.55;color:#2b3644;margin:0 0 12px;text-align:justify}
.kescala{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.knum{padding:20px 0;font-size:19px;font-weight:600;border-radius:14px;cursor:pointer;
  font-family:inherit;background:#fff;border:2px solid #b9c0cb;color:#14181f}
.knum.nr{border-color:#c98f8a}
.knum.ny{border-color:#c9a227}
.knum.ng{border-color:#7fa98a}
.knum.sel{background:#0b1f3b;color:#fff;border-color:#0b1f3b}
@media (max-width:420px){ .kescala{grid-template-columns:repeat(4,1fr)} }
</style>
</head><body>
<title>Questionário — Clínica Maximus</title>
<style>
  :root{
    --navy-900:#0D1B2A;
    --navy-800:#11253E;
    --navy-700:#1B3654;
    --gold:#C9A961;
    --gold-soft:#E7D9B8;
    --cream:#FBF8F2;
    --cream-dim:#F1ECE1;
    --graphite:#3A3A3A;
    --graphite-soft:#767268;
    --line:#E4DFD2;

    --sev-none:#3D8361;
    --sev-mild:#8AA05B;
    --sev-midmod:#D6A63B;
    --sev-mod:#D97D3D;
    --sev-severe:#C0483A;

    --bg:var(--cream);
    --surface:#ffffff;
    --ink:var(--graphite);
    --ink-soft:var(--graphite-soft);
    --accent:var(--gold);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-900);
    color:var(--ink);
    font-family:"Montserrat",-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  h1,h2,h3,.num-display{
    font-family:"Playfair Display",Georgia,"Times New Roman",serif;
    text-wrap:balance;
  }

  /* ---------- HEADER ---------- */
  header.brand{
    background:linear-gradient(160deg,var(--navy-900),var(--navy-800));
    border-bottom:2px solid var(--gold);
    padding:22px clamp(16px,4vw,40px);
    display:flex;
    align-items:center;
    gap:16px;
  }
  .knight{
    width:42px;height:42px;flex:0 0 auto;
    display:block;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text .wordmark{
    font-family:"Montserrat",sans-serif;
    font-weight:700;
    letter-spacing:0.06em;
    color:#fff;
    font-size:15px;
  }
  .brand-text .sub{
    font-family:"Montserrat",sans-serif;
    font-weight:400;
    letter-spacing:0.10em;
    color:var(--gold-soft);
    font-size:9.5px;
    text-transform:uppercase;
  }
  header.brand .tool-title{
    margin-left:auto;
    text-align:right;
    color:#fff;
  }
  header.brand .tool-title .t1{
    font-size:clamp(15px,2.4vw,19px);
    font-weight:600;
  }
  header.brand .tool-title .t2{
    font-family:"Montserrat",sans-serif;
    font-size:10.5px;
    color:var(--gold-soft);
    letter-spacing:0.03em;
  }

  /* ---------- MAIN ---------- */
  main{
    flex:1;
    display:flex;
    justify-content:center;
    padding:clamp(20px,4vw,48px) 16px 40px;
  }
  .stage{
    width:100%;
    max-width:620px;
  }

  .card{
    background:var(--surface);
    border-radius:18px;
    box-shadow:0 24px 60px -28px rgba(13,27,42,0.55);
    border:1px solid var(--line);
    overflow:hidden;
  }

  /* progress */
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:20px clamp(18px,4vw,32px) 0;
  }
  .progress-row .step-label{
    font-size:11px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
    white-space:nowrap;
  }
  .dots{display:flex;gap:6px;flex:1;}
  .dots i{
    flex:1;
    height:4px;
    border-radius:3px;
    background:var(--cream-dim);
    display:block;
    position:relative;
    overflow:hidden;
  }
  .dots i.done, .dots i.active{background:var(--gold);}
  .dots i.active::after{
    content:"";position:absolute;inset:0;
    background:var(--navy-800);
    animation:none;
  }

  /* question */
  .q-wrap{padding:26px clamp(18px,4vw,32px) 30px;}
  .q-eyebrow{
    font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--gold);font-weight:700;margin-bottom:10px;
  }
  .q-text{
    font-size:clamp(18px,2.6vw,21px);
    font-weight:600;
    color:var(--navy-900);
    line-height:1.4;
    margin:0 0 22px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:14px;
    text-align:left;
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--cream);
    cursor:pointer;
    font:inherit;
    color:var(--ink);
    font-size:14.5px;
    font-weight:500;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:hover{border-color:var(--gold);background:#fff;}
  .opt:active{transform:scale(0.99);}
  .opt .badge{
    flex:0 0 auto;
    width:28px;height:28px;
    border-radius:50%;
    border:1.5px solid var(--graphite-soft);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:12.5px;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    transition:all .15s ease;
  }
  .opt.selected{
    border-color:var(--navy-800);
    background:var(--navy-900);
    color:#fff;
  }
  .opt.selected .badge{
    border-color:var(--gold);
    background:var(--gold);
    color:var(--navy-900);
  }

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 clamp(18px,4vw,32px) 26px;
    gap:12px;
  }
  button{font:inherit;}
  .btn{
    appearance:none;border:none;cursor:pointer;
    border-radius:10px;
    padding:12px 22px;
    font-weight:600;
    font-size:13.5px;
    letter-spacing:0.01em;
    transition:opacity .15s ease, transform .1s ease;
  }
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn:active:not(:disabled){transform:scale(0.98);}
  .btn-ghost{background:transparent;color:var(--ink-soft);}
  .btn-ghost:hover:not(:disabled){color:var(--navy-900);}
  .btn-primary{background:var(--navy-900);color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--navy-800);}
  .btn-gold{background:var(--gold);color:var(--navy-900);}
  .btn-gold:hover{background:#d8bd80;}

  /* ---------- RESULTS ---------- */
  .results{padding:30px clamp(18px,4vw,34px) 32px;}
  .result-top{
    display:flex;
    gap:26px;
    align-items:center;
    flex-wrap:wrap;
    padding-bottom:24px;
    border-bottom:1px solid var(--line);
    margin-bottom:24px;
  }
  .gauge-wrap{position:relative;width:132px;height:132px;flex:0 0 auto;}
  .gauge-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .gauge-wrap .track{fill:none;stroke:var(--cream-dim);stroke-width:10;}
  .gauge-wrap .fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .7s cubic-bezier(.4,0,.2,1), stroke .3s ease;}
  .gauge-center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .gauge-center .num{font-size:34px;font-weight:700;color:var(--navy-900);line-height:1;font-variant-numeric:tabular-nums;}
  .gauge-center .den{font-size:11px;color:var(--ink-soft);letter-spacing:0.04em;margin-top:2px;}

  .result-meta{flex:1;min-width:200px;}
  .result-meta .eyebrow{
    font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:6px;
  }
  .class-pill{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 14px 6px 10px;
    border-radius:100px;
    font-weight:700;font-size:14px;
    color:#fff;
    margin-bottom:10px;
  }
  .class-pill .dot{width:8px;height:8px;border-radius:50%;background:#fff;}
  .result-meta p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5;max-width:34ch;}

  .section-title{
    font-size:11px;letter-spacing:0.09em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:700;margin:0 0 14px;
  }

  .kit-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:14px;
  }
  .kit-card{
    border:1.5px solid var(--line);
    border-top:3px solid var(--gold);
    border-radius:12px;
    padding:13px 12px 14px;
    background:var(--cream);
    display:flex;
    flex-direction:column;
    gap:5px;
    min-height:120px;
  }
  .kit-card .kc-role{
    font-size:9.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink-soft);display:flex;align-items:center;gap:6px;
  }
  .kit-card .kc-role .kc-icon{font-size:15px;}
  .kit-card .kc-code{
    font-family:"Playfair Display",serif;font-weight:700;font-size:16.5px;color:var(--navy-900);
  }
  .kit-card .kc-formula{font-size:10.6px;color:var(--ink);line-height:1.42;}
  .kit-card.empty{
    border-top-color:var(--line);
    background:transparent;
    border-style:dashed;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .kit-card.empty .kc-code{color:var(--ink-soft);font-size:12.5px;font-family:"Montserrat",sans-serif;font-weight:600;}
  .kit-card.wide{grid-column:1 / -1;flex-direction:row;align-items:center;gap:10px;min-height:0;padding:12px 14px;}
  .kit-card.wide .kc-code{font-size:13px;color:var(--ink-soft);font-family:"Montserrat",sans-serif;font-weight:600;}

  .alt-note{
    font-size:11.5px;color:var(--ink-soft);line-height:1.55;
    background:var(--cream-dim);
    border-left:3px solid var(--navy-700);
    border-radius:8px;
    padding:11px 13px;
    margin-bottom:18px;
  }
  .alt-note b{color:var(--ink);}

  .reco-box{
    background:var(--cream);
    border:1.5px solid var(--gold-soft);
    border-left:5px solid var(--gold);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:18px;
  }
  .reco-box .reco-line{
    font-weight:700;color:var(--navy-900);font-size:14.5px;margin-bottom:6px;
  }
  .reco-box p{margin:0;font-size:13px;color:var(--ink);line-height:1.55;}

  .breakdown{
    display:flex;flex-direction:column;gap:6px;margin-bottom:22px;
  }
  .breakdown .row{
    display:flex;justify-content:space-between;gap:10px;
    font-size:12.5px;color:var(--ink-soft);
    padding:7px 0;border-bottom:1px dashed var(--line);
  }
  .breakdown .row span:first-child{max-width:78%;color:var(--ink);}
  .breakdown .row b{color:var(--navy-900);font-variant-numeric:tabular-nums;}

  .disclaimer{
    font-size:11px;color:var(--ink-soft);line-height:1.6;
    background:var(--cream-dim);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:20px;
  }
  .disclaimer b{color:var(--ink);}

  footer.brand-footer{
    text-align:center;
    padding:16px;
    color:var(--gold-soft);
    font-size:10.5px;
    letter-spacing:0.03em;
  }

  @media (max-width:460px){
    .kit-grid{grid-template-columns:1fr;}
    .kit-card.wide{flex-direction:column;align-items:flex-start;}
    .result-top{gap:18px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>

<style>
  .fld{width:100%;box-sizing:border-box;padding:14px 16px;font-size:17px;border-radius:12px;
       border:1px solid rgba(11,31,59,.18);background:#fff;color:#0b1f3b;font-family:inherit;margin-bottom:10px;}
  .fld:focus{outline:2px solid #c9a227;outline-offset:1px;}
  .fld-hint{font-size:13px;opacity:.65;margin:-4px 0 14px;}
  .fld-err{font-size:13px;color:#b3261e;margin:-4px 0 12px;display:none;}
  .scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  .scale button{padding:12px 0;font-size:16px;border-radius:10px;border:1px solid rgba(11,31,59,.18);
       background:#fff;color:#0b1f3b;cursor:pointer;font-family:inherit;}
  .scale button.selected{background:#0b1f3b;color:#fff;border-color:#0b1f3b;}
  .rep{margin-top:18px;border-top:1px solid rgba(11,31,59,.15);padding-top:16px;}
  .rep h4{font-size:14px;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin:16px 0 8px;}
  .rep table{width:100%;border-collapse:collapse;font-size:14px;}
  .rep td{padding:5px 0;vertical-align:top;border-bottom:1px solid rgba(11,31,59,.08);}
  .rep td:first-child{opacity:.65;width:46%;}
  .dbtag{font-size:12px;opacity:.6;margin-top:8px;}
  @media print{
    body *{visibility:hidden!important;}
    #printArea,#printArea *{visibility:visible!important;}
    #printArea{position:absolute;left:0;top:0;width:100%;padding:0 8mm;}
    .noprint{display:none!important;}
    @page{margin:12mm;}
  }
</style>

  // BLOCO IDÊNTICO nos três apps (triagem, recepcao, financeiro): mude nos três.
  // tests/teste_sessao.js confere que continuam iguais e que o fluxo funciona.
  // Só age no modo 'rede'. Põe o token nas chamadas /api/ do servidor e, se a
  // sessão expirar no meio do dia, pede a senha de novo e repete a chamada.
  const Sessao = {
    perfil:null, api:null, orig:null, pedindo:null,
    NOMES:{medico:'Médico', recepcao:'Recepção', financeiro:'Financeiro'},
    chave(){ return 'maximus_sessao_'+this.perfil; },
    token(){ try{ return sessionStorage.getItem(this.chave()); }catch(e){ return null; } },
    guarda(t){ try{ if (t) sessionStorage.setItem(this.chave(), t); else sessionStorage.removeItem(this.chave()); }catch(e){} },
    async instala(api, perfil){
      this.api = api; this.perfil = perfil;
      const eu = this;
      // instala uma vez só: "configurar servidor" chama o init de novo
      if (!this.orig){
        const orig = this.orig = window.fetch.bind(window);
        window.fetch = async function(url, opt){
          const u = String((url && url.url) || url);
          if (u.indexOf(eu.api+'/api/')!==0 || /\/api\/(health|login|logout)$/.test(u)) return orig(url, opt);
          const envia = () => {
            const o = Object.assign({}, opt||{});
            o.headers = Object.assign({}, (opt && opt.headers) || {}, {'Authorization':'Bearer '+(eu.token()||'')});
            return orig(url, o);
          };
          let r = await envia();
          if (r.status===401){ eu.guarda(null); await eu.pede(); r = await envia(); }
          return r;
        };
      }
      const orig = this.orig;
      // confere a sessão ao abrir, antes de qualquer tela usar o banco
      let valida = false;
      if (this.token()){
        try{ const r = await orig(api+'/api/sessao', {headers:{'Authorization':'Bearer '+this.token()}, cache:'no-store'}); valida = r.ok; }catch(e){}
      }
      if (!valida){ this.guarda(null); await this.pede(); }

    pede(){

          + '<label for="sessaoSenha" style="display:block;font-size:14px;margin-bottom:6px;color:#3a434c;">Senha</label>'
          + '<input id="sessaoSenha" type="password" autocomplete="current-password" required style="box-sizing:border-box;width:100%;font-size:16px;padding:12px 14px;border:1px solid #b9c1c9;border-radius:10px;outline-offset:2px;">'
          + '<div id="sessaoErro" role="alert" style="min-height:20px;margin:8px 0 6px;font-size:14px;color:#b3261e;"></div>'
          + '<button id="sessaoEntrar" type="submit" style="width:100%;font-size:16px;font-weight:600;padding:13px;border:0;border-radius:10px;background:#1b1f24;color:#fff;cursor:pointer;">Entrar</button>'
          + '</form>';
        document.body.appendChild(fundo);
        const campo = fundo.querySelector('#sessaoSenha'), erro = fundo.querySelector('#sessaoErro'), botao = fundo.querySelector('#sessaoEntrar');
        setTimeout(()=>{ try{ campo.focus(); }catch(e){} }, 30);

          ev.preventDefault();
          if (!campo.value) return;
          botao.disabled = true; botao.textContent = 'Conferindo…'; erro.textContent = '';

            const r = await eu.orig(eu.api+'/api/login', {method:'POST', headers:{'Content-Type':'application/json'},

            if (r.ok){
              const j = await r.json(); eu.guarda(j.token);

            msg = r.status===429 ? 'Muitas tentativas erradas. Aguarde alguns minutos.' : 'Senha incorreta.';
          }catch(e){}
          erro.textContent = msg; campo.value = ''; campo.focus();
          botao.disabled = false; botao.textContent = 'Entrar';

    if(!podeSalvar) return null;
    try{
      const r=JSON.parse(sessionStorage.getItem(RASC)||'null');

      // rascunho de mais de 3 h é de outro paciente
      if(Date.now()-(r.em||0) > 3*3600*1000){ limparRascunho(); return null; }

        inp.value = c.id==='telefone' ? fmtTel(S.telefone) : (S[c.id]||'');

          if (c.id==='iniciais'){ S.iniciais=fmtIniciais(inp.value); inp.value=S.iniciais; }
          else if (c.id==='telefone'){ S.telefone=fmtTel(inp.value); inp.value=S.telefone; }

          const erro = (c.id==='telefone' && ok(S.telefone) && !telOK(S.telefone))
                    || (c.id==='email' && ok(S.email) && !emailOK(S.email))
                    || (c.id!=='iniciais' && !ok(S.telefone) && !ok(S.email));
          inp.classList.toggle('kfld-falta', !!erro);
          pinta_aviso(); sync();
        };
        box.appendChild(inp);
      });
      pinta_aviso();
      box.appendChild(aviso);
      w.appendChild(box);
    } else if (sc.kind==='campos'){
      sc.campos.forEach(c=>{
        const l=document.createElement('div'); l.className='klab'; l.textContent=c.label; w.appendChild(l);
        if (c.min!==undefined && c.max!==undefined){ w.appendChild(montaRoleta(c)); return; }
        const inp=document.createElement('input'); inp.className='kfld kfld-num'; inp.type='text';
        inp.inputMode='decimal'; inp.placeholder=c.ph||''; inp.value=S[c.id]||'';
        inp.oninput=()=>{S[c.id]=inp.value; sync();};
        w.appendChild(inp);
      });
    } else if (sc.kind==='text'){
      const inp=document.createElement('input'); inp.className='kfld'; inp.placeholder=sc.ph||'';
      inp.value=S[sc.id]||'';
      const err=document.createElement('div'); err.className='kerro'; err.id='kerro';
      err.textContent='O código precisa ser MX seguido de 4 números. Exemplo: MX0042.';
      err.style.display='none';
      inp.oninput=()=>{ S[sc.id]=inp.value;
        if (sc.id==='codigo'){
          const cheio=String(inp.value||'').trim().length>0;
          err.style.display = (cheio && !codValido()) ? 'block' : 'none';
          inp.classList.toggle('kfld-erro', cheio && !codValido());
        }
        sync(); };
      w.appendChild(inp);
      if (sc.id==='codigo') w.appendChild(err);
    } else {
      sc.options.forEach(o=>{
        const b=document.createElement('button'); b.type='button';
        const sel = sc.kind==='multi' ? (S[sc.id]||[]).includes(o.v) : S[sc.id]===o.v;
        b.className='kopt'+(sel?' sel':''); b.textContent=o.label;
        b.onclick=()=>{
          if (sc.id==='tipoVisita'){
            S[sc.id]=o.v; pinta();
            (async()=>{
              const b=el('avancar'); b.style.display='block'; b.disabled=true; b.textContent='Verificando…';
              await buscarPaciente();
              monta(); i=Math.min(i+1, telas.length-1); pinta();
            })();
            return;
          }
          if (sc.kind==='multi'){
            let a=S[sc.id]||[];
            if (o.v==='nenhuma') a=['nenhuma'];
            else { a=a.filter(x=>x!=='nenhuma'); a=a.includes(o.v)?a.filter(x=>x!==o.v):a.concat([o.v]); }
            S[sc.id]=a; pinta();
          } else {
            S[sc.id]=o.v; monta();
            setTimeout(()=>{ if(i<telas.length-1){ i++; pinta(); } else enviar(); },160);
          }
        };
        w.appendChild(b);
      });
    }
    if (sc.hint){ const h=document.createElement('div'); h.className='khint'; h.textContent=sc.hint; w.appendChild(h); }
    el('voltar').style.visibility = i===0?'hidden':'visible';
    salvarRascunho();
    sync();
  }

  function fmtIniciais(v){
    return String(v||'').toUpperCase().replace(/[^A-ZÀ-Ý ]/g,'').replace(/\s+/g,' ').slice(0,6);
  }
  function soDigitos(v){ return String(v||'').replace(/\D/g,'').slice(0,11); }
  function fmtTel(v){
    const d = soDigitos(v);
    if (!d) return '';
    if (d.length<=2) return '('+d;
    const ddd=d.slice(0,2), r=d.slice(2);
    if (r.length<=4) return '('+ddd+')'+r;
    if (r.length<=8) return '('+ddd+')'+r.slice(0,4)+'-'+r.slice(4);
    return '('+ddd+')'+r.slice(0,5)+'-'+r.slice(5);
  }
  function telOK(v){ const d=soDigitos(v); return d.length===10 || d.length===11; }
  function emailOK(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||'').trim()); }
  function temContatoValido(){
    return (ok(S.telefone) && telOK(S.telefone)) || (ok(S.email) && emailOK(S.email));
  }
  function contatoSemErro(){
    if (ok(S.telefone) && !telOK(S.telefone)) return false;
    if (ok(S.email) && !emailOK(S.email)) return false;
    return true;
  }

  function montaRoleta(c){
    const min=+c.min, max=+c.max, H=56;
    const inicio = ok(S[c.id]) ? Math.min(max, Math.max(min, Math.round(parseFloat(String(S[c.id]).replace(',','.'))))) : (c.inicio||Math.round((min+max)/2));
    const box=document.createElement('div'); box.className='krol';
    const band=document.createElement('div'); band.className='band';
    const lista=document.createElement('div'); lista.className='lista'; lista.tabIndex=0;
    lista.setAttribute('role','listbox'); lista.setAttribute('aria-label', c.label||c.id);
    let html='';
    for(let v=min; v<=max; v++) html += '<div class="it" data-v="'+v+'">'+v+'</div>';
    lista.innerHTML=html;
    const un=document.createElement('div'); un.className='un'; un.textContent=c.unidade||'';
    let atual=null, raf=0;
    function marca(v){
      const antigo = lista.querySelector('.it.on'); if (antigo) antigo.classList.remove('on');
      const novo = lista.children[v-min]; if (novo) novo.classList.add('on');
      atual=v;
    }
    lista.addEventListener('scroll', ()=>{
      cancelAnimationFrame(raf);
      raf=requestAnimationFrame(()=>{
        const v=Math.min(max, Math.max(min, min+Math.round(lista.scrollTop/H)));
        marca(v); S[c.id]=String(v); sync();
      });
    }, {passive:true});
    lista.addEventListener('click', e=>{
      const it=e.target.closest('.it'); if(!it) return;
      const v=+it.dataset.v;
      marca(v); S[c.id]=String(v); sync();
      try{ lista.scrollTo({top:(v-min)*H, behavior:'smooth'}); }catch(err){ lista.scrollTop=(v-min)*H; }
    });
    lista.addEventListener('keydown', e=>{
      if (e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault();
        const v=Math.min(max, Math.max(min, (atual||inicio)+(e.key==='ArrowDown'?1:-1)));
        lista.scrollTop=(v-min)*H; }
    });
    box.appendChild(band); box.appendChild(lista); box.appendChild(un);
    setTimeout(()=>{ lista.scrollTop=(inicio-min)*H; marca(inicio); }, 0);
    return box;
  }

  function respondida(sc){
    if (sc.id==='codigo') return true;   // vazio significa aceitar o sugerido
    if (sc.kind==='contato') return temContatoValido() && contatoSemErro();
    if (['intro','jornada','campos','termo','entrega','preintro','prefim'].indexOf(sc.kind)>=0) return true;
    if (sc.kind==='corrigir') return false;
    if (sc.kind==='multi') return (S[sc.id]||[]).length>0;
    if (sc.kind==='escala') return S[sc.id]!==undefined;
    if (sc.id==='codigo') return codValido();
    return ok(S[sc.id]);
  }
  function sync(){
    const sc=telas[i], fim=i===telas.length-1, b=el('avancar');
    // nas telas de toque único o próprio toque avança, então o botão não existe
    b.style.display = (sc.kind==='opts'||sc.kind==='escala') ? 'none' : 'block';
    b.disabled = !respondida(sc);
    if (sc.kind==='corrigir'){ b.style.display='none'; el('voltar').style.visibility='visible'; }
    b.textContent = sc.kind==='entrega' ? 'Entregar ao paciente'
                  : sc.kind==='preintro' ? 'Começar'
                  : sc.kind==='prefim' ? 'Enviar respostas'
                  : sc.kind==='intro' ? 'Começar'
                  : (sc.kind==='jornada' ? 'Entendi'
                  : (sc.kind==='termo' ? 'Terminei de ler'
                  : (fim ? 'Enviar respostas' : 'Continuar')));
  }
  async function buscarPaciente(){
    const cod=norm(S.codigo);
    S.achou=null; S.conflito=false;
    try{
      const r = await Store.ultimo(cod);
      // o adaptador pode devolver o ciclo direto ou {ciclo,total,ultimaData}
      const ciclo = r ? (r.ciclo || (r.data || r.protocolo ? r : null)) : null;
      if (ciclo){
        S.achou = ciclo;
        S.totalCiclos = (r && r.total) || 1;
        const d = new Date((r && r.ultimaData) || ciclo.data || Date.now());
        S.diasUlt = Math.max(0, Math.round((Date.now()-d.getTime())/86400000));
        S.dataUlt = d.toLocaleDateString('pt-BR');
        const m = ciclo.medidas || ciclo.medidasRecepcao || {};
        S.pesoAnt = m.peso||null; S.alturaAnt = m.altura||null;
      }
      // queixa anterior e se já houve procedimento de preenchimento
      try{
        const todos = await Store.historico(cod);
        const recs = (todos||[]).filter(x=>x.queixaRecepcao);
        if (recs.length) S.queixaAnterior = recs[recs.length-1].queixaRecepcao;
        // contato já cadastrado: a recepção confirma em vez de digitar de novo
        // contato do cadastro: pega o mais recente de cada campo, não só do último registro
        const ordenados = (todos||[]).slice().sort((a,b)=>new Date(a.data||0)-new Date(b.data||0));
        const ultimoCom = campo => {
          for (let i=ordenados.length-1;i>=0;i--){ const v=ordenados[i][campo]; if (v) return v; }
          return null;
        };
        const ini = ultimoCom('iniciais'), tel = ultimoCom('telefone'), mail = ultimoCom('email');
        if (!ok(S.iniciais) && ini) S.iniciais = fmtIniciais(ini);
        if (!ok(S.telefone) && tel) S.telefone = fmtTel(tel);
        if (!ok(S.email) && mail) S.email = String(mail).trim();
        S.contatoDoBanco = !!(ini || tel || mail);
        S.contatoFaltando = !!S.achou && !S.contatoDoBanco;
        const pre = (todos||[]).filter(x=>x.preench && (x.preench.mlUsado || x.preench.marca));
        if (pre.length){
          S.fezPreench = true;
          const u = pre[pre.length-1];
          const d = new Date(u.data||Date.now());
          S.preenchData = d.toLocaleDateString('pt-BR');
          S.preenchDias = Math.max(0, Math.round((Date.now()-d.getTime())/86400000));
        }
      }catch(e){}
      if (ciclo){
      }
    }catch(e){}
    S.conflito = (S.tipoVisita==='novo' && !!S.achou) || (S.tipoVisita==='retorno' && !S.achou);
  }


  el('avancar').onclick=async()=>{
    const sc=telas[i];
    if(!respondida(sc)) return;
    if (sc.id==='codigo'){
      if (!ok(S.codigo) && S.sugerido) S.codigo = S.sugerido;
      if (!codOK(S.codigo)){
        const e=el('kerro');
        if(e) e.style.display='block';
        const inp=el('opcoes').querySelector('input');
        if(inp) inp.classList.add('kfld-erro');
        return;
      }
      S.codigo = norm(S.codigo);
    }
    monta();
    if(i<telas.length-1){ i++; pinta(); return; }
    await enviar();
  };
  el('voltar').onclick=()=>{
    if (telas[i] && telas[i].kind==='corrigir'){
      delete S.achou; delete S.conflito; delete S.motivoConflito; delete S.tipoVisita;
      i=1; monta(); i=1; pinta(); return;
    }
    if(i>0){ i--; monta(); pinta(); }
  };

  async function enviar(){
    if (salvo) return;
    const b=el('avancar'); b.style.display='block'; b.disabled=true; b.textContent='Enviando…';
    const iief = Q_IIEF.every(q=>ok(S[q.id])) ? Q_IIEF.reduce((a,q)=>a+Number(S[q.id]),0) : null;
    const pedt = Q_PEDT.every(q=>ok(S[q.id])) ? Q_PEDT.reduce((a,q)=>a+Number(S[q.id]),0) : null;
    const adam = (S.adam||[]).filter(v=>v!=='nenhuma');
    const nm = x => parseFloat(String(x||'').replace(',','.')) || null;
    const peso=nm(S.peso), altura=nm(S.altura), cintura=nm(S.cintura);
    const imc = (peso&&altura) ? +(peso/Math.pow(altura/100,2)).toFixed(1) : null;
    const agora=new Date();
    const hora=agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const diaLocal = agora.getFullYear()+'-'+String(agora.getMonth()+1).padStart(2,'0')+'-'+String(agora.getDate()).padStart(2,'0');
    const reg={data:agora.toISOString(), hora, dataBR:agora.toLocaleDateString('pt-BR'), dataLocal:diaLocal,
      codigo:norm(S.codigo), tipo:'recepcao', linha:'recepcao',
      iniciais:(S.iniciais||'').trim()||null,
      telefone:(S.telefone? fmtTel(S.telefone):'')||null,
      email:(S.email||'').trim()||null,
      queixaRecepcao:S.queixa, iief, pedt, adam,
      dificuldade:S.dificuldade||null, revisar:(S.dificuldade==='sim'||S.dificuldade==='muito'),
      medidas:{idade:(S.idade?parseInt(S.idade,10):null), peso, altura, cintura, imc},
      leuTermo:(S.verTermo==='sim'),
      retornoPreench: (S.queixa==='preench' && S.fezPreench) ? {
        reacoes:(S.reacaoPre||[]).filter(v=>v!=='nenhuma'),
        desconforto:S.descPre||null,
        satisfacao:(S.satisfPre===undefined?null:S.satisfPre),
        diasDesdeProcedimento:S.preenchDias!=null?S.preenchDias:null
      } : null,
      retorno:!!S.achou, diasDesdeUltima:(S.achou?S.diasUlt:null),
      usoRelatado:S.usoTrat||null, efeitoRelatado:S.efeitoPac||null,
      satisfRelatada:(S.satisfPacRec===undefined?null:S.satisfPacRec),
      autorrelato:(S.queixa==='clinica') ? {
        comorbidades:(S.comorbPac||[]).filter(v=>v!=='nenhuma'),
        medicacoes:(S.medsPac||[]).filter(v=>v!=='nenhuma'),
        alergias:(S.alergPac||[]).filter(v=>v!=='nao')
      } : null,
      respostas:{i0:S.i0,i1:S.i1,i2:S.i2,i3:S.i3,i4:S.i4,p0:S.p0,p1:S.p1,p2:S.p2,p3:S.p3,p4:S.p4}};
    const okSalvo = await Store.salvarRecepcao(reg);
    salvo=true; limparRascunho();
    el('quiz').style.display='none'; el('fim').style.display='block';
    const extra = S.queixa==='preench'
      ? 'O médico vai conversar com você sobre a avaliação.'
      : (reg.revisar ? '<span class="kpend">Você avisou que ficou em dúvida em alguma pergunta — o médico vai revisar com você na consulta.</span>' : '');
    el('fimTxt').innerHTML = okSalvo
      ? (S.queixa==='preench' ? 'Tudo certo!' : 'Suas respostas já estão com o médico.')
        + (extra ? '<br>'+extra : '')
        + '<br><br><b>Pode devolver o tablet à recepção.</b>'
      : 'Não conseguimos enviar automaticamente.<br><b>Avise a recepção e mostre esta tela para ela.</b>';
    el('fimCod').innerHTML = norm(S.codigo) + '<span class="khora">' + hora + '</span>';
  }
  el('novo').onclick=()=>{ limparRascunho(); Object.keys(S).forEach(k=>delete S[k]); i=0; salvo=false;
    el('fim').style.display='none'; el('quiz').style.display='block'; monta(); pinta(); };

  (async()=>{
    try{ await storePronto; const c=await Store.proximoCodigo();
      if (c && !S.codigo){ S.codigoSugerido=c; S.codigo=c; monta(); pinta(); }
    }catch(e){}
  })();

  const rascunho = lerRascunho();
  if (rascunho){
    const min = Math.max(1, Math.round((Date.now()-rascunho.em)/60000));
    el('quiz').style.display='none';
    el('fim').style.display='block';
    el('fimTxt').innerHTML = 'Encontramos um questionário em andamento de <b>'+String(rascunho.S.codigo||'').toUpperCase()+'</b>,'
      + ' interrompido há '+min+(min===1?' minuto':' minutos')+'.<br>O que você quer fazer?';
    el('fimCod').innerHTML = '';
    const b1=document.createElement('button'); b1.className='kbtn kprim'; b1.textContent='Continuar de onde parou';
    b1.style.marginBottom='10px'; b1.style.width='100%';
    b1.onclick=()=>{ Object.assign(S, rascunho.S); i=Math.min(rascunho.i||0, 99);
      el('fim').style.display='none'; el('quiz').style.display='block';
      monta(); if(i>=telas.length) i=telas.length-1; pinta(); };
    const b2=document.createElement('button'); b2.className='kbtn kghost'; b2.textContent='Começar um novo questionário';
    b2.style.width='100%'; b2.style.flex='none';
    b2.onclick=()=>{ Object.keys(S).forEach(k=>delete S[k]); i=0; limparRascunho();
      el('fim').style.display='none'; el('quiz').style.display='block';
      monta(); pinta(); limparRascunho(); iniciarSugestao(); };
    const cx=el('acoesFim')||el('novo').parentElement; cx.innerHTML=''; cx.appendChild(b1); cx.appendChild(b2);
  }

  function iniciarSugestao(){
    (async()=>{
      try{ await storePronto; S.sugerido = await Store.proximoCodigo(); }catch(e){}
      if (i===0){ monta(); pinta(); }
    })();
  }
  if (!rascunho) iniciarSugestao();

  monta(); pinta();

})();
</script>
